# Rend chaque carrousel ajouté ou modifié dans slideshow/carousels/ et met les slides à télécharger
# (onglet Actions → le run → « Artifacts »). Les fichiers qui commencent par « _ » sont ignorés.
# Publication automatique via Postiz : seulement si le secret POSTIZ_API_KEY est défini
# (POSTIZ_TIKTOK_ID et POSTIZ_URL optionnels).
name: Carrousels TikTok

on:
  push:
    branches: [main]
    paths: ["slideshow/carousels/**"]
  workflow_dispatch:
    inputs:
      carousels:
        description: "Fichiers à rendre (séparés par des espaces, chemins depuis slideshow/)"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
    defaults:
      run:
        working-directory: slideshow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Carrousels à rendre
        id: files
        env:
          INPUT_CAROUSELS: ${{ inputs.carousels }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_CAROUSELS" ]; then
            files="$INPUT_CAROUSELS"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$GITHUB_SHA~1"
            fi
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- carousels/ \
              | sed 's|^slideshow/||' | grep -E '^carousels/[^_][^/]*\.json$' || true)
          fi
          echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"
          echo "À rendre : ${files:-aucun}"

      - name: Rendu des slides
        if: steps.files.outputs.files != ''
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: python3 render.py $FILES

      - name: Slides à télécharger
        if: steps.files.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: carrousels
          path: slideshow/out/

      - name: Publication Postiz (si configurée)
        if: steps.files.outputs.files != '' && env.POSTIZ_API_KEY != ''
        env:
          POSTIZ_TIKTOK_ID: ${{ secrets.POSTIZ_TIKTOK_ID }}
          POSTIZ_URL: ${{ secrets.POSTIZ_URL || 'https://api.postiz.com/public/v1' }}
          FILES: ${{ steps.files.outputs.files }}
        run: python3 publish.py $FILES
