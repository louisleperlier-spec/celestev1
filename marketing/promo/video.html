<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07070A;font-family:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#F5F5F7}
#fond{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 62%,rgba(255,107,26,.20),rgba(255,107,26,0) 70%),radial-gradient(ellipse 120% 80% at 50% 50%,#121217 0%,#07070A 70%)}
#lueur{position:absolute;left:50%;top:62%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,26,.28),rgba(255,107,26,0) 65%);filter:blur(30px)}
#scene{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 55%}
#tel{position:absolute;left:50%;top:50%;width:620px;height:1344px;margin:-672px 0 0 -310px;transform-style:preserve-3d}
.corps{position:absolute;inset:0;border-radius:96px;background:linear-gradient(135deg,#3a3a42,#16161a 40%,#2a2a30 70%,#0d0d10);box-shadow:0 60px 120px rgba(0,0,0,.7),0 0 0 2px #4a4a52 inset}
.cote{position:absolute;inset:6px;border-radius:90px;background:#050506}
.ecran{position:absolute;inset:20px;border-radius:76px;overflow:hidden;background:#0E0E11}
.ecran img{position:absolute;left:0;top:0;width:100%;height:auto;opacity:0}
.ile{position:absolute;left:50%;top:38px;width:170px;height:50px;margin-left:-85px;border-radius:25px;background:#000;z-index:5}
.reflet{position:absolute;inset:20px;border-radius:76px;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 45%,rgba(255,255,255,0) 60%);background-size:300% 100%;z-index:6;pointer-events:none}
.bouton{position:absolute;width:8px;border-radius:4px;background:linear-gradient(90deg,#55555d,#2a2a30)}
#haut{position:absolute;left:70px;right:70px;top:120px;text-align:center;z-index:10;display:flex;flex-direction:column;align-items:center;gap:26px}
#titre{text-align:center}
#titre .l{display:block;font-size:84px;line-height:1.08;font-weight:800;letter-spacing:-2px}
#titre .m{display:inline-block;opacity:0;transform:translateY(40px);margin:0 10px}
#titre .o{color:#FF6B1A}
#sous{max-width:860px;text-align:center;font-size:38px;line-height:1.3;color:rgba(245,245,247,.7);font-weight:500;opacity:0}
#fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:20}
#fin img{width:260px;height:260px;border-radius:60px;box-shadow:0 0 120px rgba(255,107,26,.55)}
#fin .n{font-size:150px;font-weight:800;letter-spacing:-4px;margin-top:50px}
#fin .s{font-size:44px;color:rgba(245,245,247,.75);margin-top:10px;font-weight:500}
#fin .a{margin-top:70px;padding:28px 56px;border-radius:999px;background:#F5F5F7;color:#0E0E11;font-size:40px;font-weight:700;box-shadow:0 0 60px rgba(255,107,26,.5)}
#voile{position:absolute;inset:0;background:#07070A;z-index:30;opacity:1;pointer-events:none}
</style></head><body>
<div id="fond"></div><div id="lueur"></div>
<div id="scene"><div id="tel">
 <div class="bouton" style="left:-8px;top:250px;height:60px"></div><div class="bouton" style="left:-8px;top:350px;height:110px"></div><div class="bouton" style="left:-8px;top:480px;height:110px"></div><div class="bouton" style="right:-8px;top:400px;height:170px"></div>
 <div class="corps"></div><div class="cote"></div>
 <div class="ecran" id="ecran"></div><div class="ile"></div><div class="reflet" id="reflet"></div>
</div></div>
<div id="haut"><div id="titre"></div><div id="sous"></div></div>
<div id="fin"><img src="ecrans/icon.png"><div class="n">NÉA</div><div class="s">Ton coach sportif IA</div><div class="a">Disponible sur l’App Store</div></div>
<div id="voile"></div>
<script>
// Scènes : [début, fin, écran(s), titre (mots, * = orange), sous-titre, caméra {ry, rx, rz, s, x, y}]
const S=[
 [0,3.6,['accueil'],['Ton','*coach','sportif,','dans','ta','poche.'],'Séances, sommeil, récupération : tout est là.',{ry:-28,rx:12,rz:4,s:1.06,x:40,y:470}],
 [3.6,7.2,['accueil','accueil2'],['Ton','bilan','du','jour','en','un','*coup','*d’œil.'],'Énergie, activité, sommeil et le mot de ton coach.',{ry:22,rx:8,rz:-3,s:1.12,x:-30,y:450}],
 [7.2,10.8,['programme','programme2'],['Un','programme','qui','*s’adapte','*à','*toi.'],'Ta séance du jour, exercice par exercice.',{ry:-18,rx:14,rz:2,s:1.16,x:30,y:470}],
 [10.8,14.2,['calendrier'],['Chaque','séance','*compte.'],'Ta série, ton mois, ta semaine.',{ry:26,rx:6,rz:-4,s:1.08,x:-20,y:450}],
 [14.2,17.8,['progres','progres2'],['Vois','tes','*progrès','semaine','après','semaine.'],'Séances, temps actif, sommeil, VFC.',{ry:-24,rx:10,rz:3,s:1.12,x:30,y:470}],
 [17.8,21,['profil'],['Ton','espace,','*à','*ta','*façon.'],'Alertes, santé, abonnement : tout se règle ici.',{ry:20,rx:12,rz:-2,s:1.06,x:-20,y:460}],
];
const FIN=21, TOTAL=25;
const ecran=document.getElementById('ecran'), imgs={};
for(const n of ['accueil','accueil2','programme','programme2','calendrier','progres','progres2','profil']){const i=new Image();i.src='ecrans/'+n+'.png';ecran.appendChild(i);imgs[n]=i}
const titre=document.getElementById('titre'), sous=document.getElementById('sous');
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
let rendu=-1;
function poserTitre(i){if(rendu===i)return;rendu=i;titre.innerHTML='';if(i<0)return;const l=document.createElement('span');l.className='l';
 S[i][3].forEach(w=>{const m=document.createElement('span');m.className='m'+(w[0]==='*'?' o':'');m.textContent=w.replace('*','');l.appendChild(m)});titre.appendChild(l);sous.textContent=S[i][4]}
window.render=function(t){
 // scène courante et caméra interpolée entre les scènes (transition d'1 s)
 let i=S.findIndex(s=>t>=s[0]&&t<s[1]); if(t>=FIN) i=S.length-1;
 const s=S[i], c=s[5]; let cam={...c};
 const dt=t-s[0];
 if(i>0&&dt<1.0){const p=S[i-1][5],k=ease(cl(dt/1.0));for(const key in cam)cam[key]=lerp(p[key],c[key],k)}
 // dérive lente pendant la scène
 const u=cl((t-s[0])/(s[1]-s[0]));
 cam.ry+= (u-.5)*8*(c.ry>0?-1:1); cam.s+= u*.04;
 // entrée du téléphone (monte du bas) et sortie vers la fin
 let y=cam.y, op=1;
 if(t<1.2){const k=ease(cl(t/1.2));y=lerp(1400,cam.y,k);cam.rx=lerp(40,cam.rx,k)}
 if(t>FIN-0.2){const k=ease(cl((t-FIN+0.2)/0.9));y=lerp(cam.y,cam.y+250,k);op=1-k;cam.s=lerp(cam.s,.8,k)}
 document.getElementById('tel').style.transform=`translate3d(${cam.x}px,${y}px,0) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg) rotateZ(${cam.rz}deg) scale(${cam.s})`;
 document.getElementById('tel').style.opacity=op;
 document.getElementById('reflet').style.backgroundPosition=`${100-((t*18)%100)*1.5}% 0`;
 // écrans : le nouvel écran monte par-dessus l'ancien (glissement, sans fondu), aussi au milieu des scènes à 2 écrans
 for(const n in imgs){imgs[n].style.opacity=0;imgs[n].style.transform='translateY(0)';imgs[n].style.zIndex=0}
 const H=ecran.clientHeight, ecr=s[2];
 const pose=(n,y,z)=>{imgs[n].style.opacity=1;imgs[n].style.transform=`translateY(${y}px)`;imgs[n].style.zIndex=z};
 const entree=(d)=>(1-ease(cl(d/.55)))*H;
 const dur=s[1]-s[0], mi=s[0]+dur*.5;
 const pe=i>0?S[i-1][2]:null, meme=pe&&pe[pe.length-1]===ecr[0];
 if(pe&&!meme&&dt<.55){pose(pe[pe.length-1],0,1)}
 if(ecr.length===1||t<mi){pose(ecr[0],i>0&&!meme?entree(dt):0,2)}
 else{pose(ecr[0],0,2);pose(ecr[1],entree(t-mi),3)}
 // titres : mots qui montent un à un, puis s'effacent
 poserTitre(t<FIN?i:-1);
 if(t<FIN){const ms=titre.querySelectorAll('.m');ms.forEach((m,j)=>{const a=cl((dt-.25-j*.09)/.45),b=cl((s[1]-t-.15)/.35);const k=ease(a)*b;m.style.opacity=k;m.style.transform=`translateY(${(1-ease(a))*40}px)`});
  sous.style.opacity=cl((dt-.8)/.5)*cl((s[1]-t-.15)/.35)}
 else{sous.style.opacity=0}
 // fin : icône, NÉA, App Store
 const f=document.getElementById('fin');const kf=cl((t-FIN-.4)/.8);f.style.opacity=ease(kf);f.style.transform=`scale(${lerp(.92,1,ease(kf))})`;
 document.getElementById('lueur').style.opacity=.6+.4*Math.sin(t*1.3);
 // fondu d'ouverture et de fermeture
 document.getElementById('voile').style.opacity=Math.max(1-cl(t/.5), cl((t-TOTAL+.6)/.6));
};
window.render(0);
</script></body></html>
